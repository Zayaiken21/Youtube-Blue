# Keeps Voices/index.json in sync with the audio files in
# "Voices/Preset Voices" and "Voices/Our Voices", so Voice Studio can list them.
name: Voice library index

on:
  push:
    branches: [main]
    paths: ['Voices/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voices-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Voices/index.json
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          def nice(stem):
              return re.sub(r'\s+', ' ', re.sub(r'[_-]+', ' ', stem)).strip() or stem
          out = {"preset": [], "shared": []}
          for key, folder in (("preset", "Voices/Preset Voices"), ("shared", "Voices/Our Voices")):
              p = pathlib.Path(folder)
              if not p.is_dir():
                  continue
              for f in sorted(p.iterdir(), key=lambda x: x.name.lower()):
                  if f.is_file() and f.suffix.lower() in (".wav", ".mp3"):
                      out[key].append({"file": f.name, "name": nice(f.stem), "size": f.stat().st_size})
          pathlib.Path("Voices/index.json").write_text(json.dumps(out, indent=2) + "\n")
          print(f"{len(out['preset'])} presets, {len(out['shared'])} shared voices")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- Voices/index.json; then echo "Index already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Voices/index.json
          git commit -m "Update voice library index"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
